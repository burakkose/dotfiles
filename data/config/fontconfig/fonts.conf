<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  Personal fontconfig.

  Rendering policy (universal across 1080p and 4K; matches what Apple
  uses on Retina):
    antialias            = true
    hinting              = true
    hintstyle            = hintslight  (let subpixel positioning preserve
                                        glyph shape; full hint distorts
                                        designed letterforms)
    rgba                 = rgb         (standard subpixel order)
    lcdfilter            = lcddefault
    embeddedbitmap       = false       (drop ugly low-res raster fonts)

  Generic-family chains include explicit emoji + CJK fallback so any
  string with non-Latin codepoints renders correctly regardless of the
  app that asked for "sans-serif" / "monospace" / "serif".
-->
<fontconfig>

  <!-- ────────────────────────────────────────────────────────── -->
  <!-- Global rendering defaults                                  -->
  <!-- ────────────────────────────────────────────────────────── -->
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"           mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Reject pure bitmap fonts (PCF/BDF) regardless of who asks. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="scalable"><bool>false</bool></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- ────────────────────────────────────────────────────────── -->
  <!-- sans-serif: Inter -> Noto Sans CJK -> Noto Color Emoji     -->
  <!-- ────────────────────────────────────────────────────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- ────────────────────────────────────────────────────────── -->
  <!-- monospace: JetBrains Mono Nerd Font (matches foot)         -->
  <!-- Falls back to Noto Sans Mono CJK + emoji + symbols.        -->
  <!-- ────────────────────────────────────────────────────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- ────────────────────────────────────────────────────────── -->
  <!-- serif: Noto Serif (Times New Roman is poor at small sizes) -->
  <!-- ────────────────────────────────────────────────────────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ────────────────────────────────────────────────────────── -->
  <!-- emoji: always Noto Color Emoji (block other emoji fonts)   -->
  <!-- ────────────────────────────────────────────────────────── -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
