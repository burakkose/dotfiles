# foot colors — COOL variant (gammastep OFF).
# Identical hues to colors-warm.ini; foreground dimmed for ~10:1
# contrast on the mantle background when no gammastep warming is
# active. The 16-color ANSI palette is unchanged (syntax).

[colors]
alpha=1.0

# Background mantle, foreground subtext1 → 9.95:1 on mantle (cool)
background=181825
foreground=bac2de

# Yellow accent at full saturation (matches waybar warm-mode pill)
flash=f9e2af
flash-alpha=0.5

# Soft surface1 selection (no bright flash on long selections)
selection-foreground=cdd6f4
selection-background=45475a

## Normal colors (0-7)
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

## Bright colors (8-15)
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

16=fab387
17=f5e0dc
