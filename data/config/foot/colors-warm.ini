# foot colors — WARM variant (gammastep ON, 3400K).
# Identical hues to colors-cool.ini; foreground brightened to
# compensate for 3400K warming which would otherwise drop contrast
# from ~10:1 to ~6.7:1. The 16-color ANSI palette is unchanged.

[colors]
alpha=1.0

# Background mantle, foreground brighter for 9.5:1 under 3400K warming
background=181825
foreground=d9deec

flash=f9e2af
