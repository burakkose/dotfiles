---
# =============================================================================
# Pacman/AUR Packages
# =============================================================================
system_arch_packages:
  # Core
  - base
  - base-devel
  - curl
  - git
  - openssh
  - wget

  # Modern CLI tools
  - bat
  - btop
  - duf
  - dust
  - eza
  - fastfetch
  - fd
  - fzf
  - htop
  - httpie
  - jq
  - powerline
  - ranger
  - ripgrep
  - the_silver_searcher
  - thefuck
  - tig
  - tmux
  - unrar

  # Shell
  - fpp-git
  - tpm
  - zinit
  - zsh

  # Container
  - podman

  # Shell history / productivity
  - atuin

  # Git tooling
  - git-delta
  - lazygit

  # Docs / reading
  - glow

system_arch_packages_desktop:
  # GUI applications
  - featherpad
  - firefox
  - galculator
  - gsimplecal
  - imagemagick
  - libreoffice-fresh
  - loupe
  - nautilus
  - papers
  - transmission-gtk
  - visual-studio-code-bin
  - xarchiver

  # Appearance
  - bibata-cursor-theme-bin
  - catppuccin-gtk-theme-mocha
  - gtk3
  - inter-font
  - noto-fonts
  - noto-fonts-cjk
  - noto-fonts-emoji
  - otf-font-awesome
  - papirus-icon-theme
  - powerline-fonts
  - siji-git
  - ttf-inconsolata
  - ttf-jetbrains-mono-nerd
  - ttf-ms-fonts
  - ttf-nerd-fonts-symbols
  - ttf-symbola

  # Audio
  - pavucontrol

  # Network
  - bluez
  - bluez-utils
  - network-manager-applet
  - networkmanager-openvpn
  - openvpn
  - wireguard-tools

# =============================================================================
# WM-specific Packages
# =============================================================================
system_arch_packages_i3:
  - arandr
  - brightness-controller-git
  - brightnessctl
  - cbatticon
  - feh
  - i3-wm
  - lxappearance
  - lxinput
  - polybar
  - pulseaudio
  - redshift
  - rofi
  - rxvt-unicode
  - scrot
  - urxvt-perls
  - vlc
  - volumeicon
  - wmctrl
  - xclip
  - xorg
  - xorg-xinit

system_arch_packages_sway:
  - brightnessctl
  - cliphist
  - foot
  - gammastep
  - grim
  - mpv
  - nwg-displays
  - pipewire
  - pipewire-alsa
  - pipewire-audio
  - pipewire-jack
  - pipewire-pulse
  - playerctl
  - satty
  - slurp
  - sway
  - swaybg
  - swaylock-effects
  - swaync
  - udiskie
  - waybar
  - wireplumber
  - wl-clipboard
  - wofi
  - xdg-desktop-portal-wlr

# =============================================================================
# Symlinks
# =============================================================================
system_arch_symlinks: []

system_arch_symlinks_desktop:
  - src: /usr/bin/firefox
    dest: /usr/bin/browser
  - src: /usr/bin/featherpad
    dest: /usr/bin/editor

# =============================================================================
# Font Configuration
# =============================================================================
system_arch_fontconfig:
  - src: /usr/share/fontconfig/conf.avail/10-hinting-full.conf
    dest: /etc/fonts/conf.d/10-hinting-full.conf
