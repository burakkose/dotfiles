---
# This file defines how dotfiles are symlinked from the repository to your home directory.
# Three categories handle different symlinking strategies:

# DIRECTLY: Simple 1:1 mapping with dot prefix
# - Items are symlinked as: ~/dotfiles/data/{item} -> ~/.{item}
# - Use for: standard dotfiles that go directly in home with a dot prefix
# - Examples:
#   - "zshrc" becomes ~/.zshrc
#   - "tmux.conf" becomes ~/.tmux.conf
dotfile_directly:
  - bin
  - lib
  - gitconfig
  - gitignore_global
  - gtkrc-2.0
  - gtkrc-2.0.mine
  - nano
  - nanorc
  - scalafmt.conf
  - themes
  - tmux.conf
  - wgetrc
  - xinitrc
  - Xresources
  - Xresources.d
  - zsh
  - zshrc
  - p10k.zsh
  - work
  - vpn

# PARTIALLY: Selective symlinking from directories
# - Only specific files/subdirs within these directories are symlinked
# - The directory itself is created, but only selected contents are linked
# - Use for: large directories where you only want to manage specific files
# - Example:
#   - "config" means only files in ~/dotfiles/data/config/* are individually
#     symlinked into ~/.config/*, not the entire directory
dotfile_partially:
  - config

# CUSTOM: Full control over source and destination paths
# - Allows non-standard path mappings (no automatic dot prefix)
# - Use for: files that need to go somewhere other than ~/.{name}
# - Format:
#     src: path/in/repository (relative to ~/dotfiles/data/)
#     dest: path/in/home (relative to ~/, no automatic dot added)
dotfile_custom:
  - src: Code/User/settings.json
    dest: .config/Code/User/settings.json
  - src: Code/User/keybindings.json
    dest: .config/Code/User/keybindings.json
  - src: environment.d/50-cursor.conf
    dest: .config/environment.d/50-cursor.conf
  - src: atuin/config.toml
    dest: .config/atuin/config.toml

# LIBADWAITA THEME PASSTHROUGH
# libadwaita (GTK4 GNOME apps: Nautilus, Loupe, Papers, etc.) ignores
# gtk-theme-name and only reads CSS / assets from ~/.config/gtk-4.0/.
# Symlink the active system theme's gtk-4.0 directory into the user
# config so libadwaita picks up the same theme as GTK3. Set to '' to
# disable libadwaita theming and fall back to default Adwaita.
dotfile_libadwaita_theme: catppuccin-mocha-lavender-standard+default

# DCONF / GSETTINGS — values that must agree with the *.ini files in
# data/config/gtk-*/ so libadwaita apps, xdg-desktop-portal and any
# GNOME setting consumer all resolve to the same theme + cursor +
# fonts + dark-mode preference. Empty value or commented-out key =
# don't manage this setting.
dotfile_gsettings:
  - { schema: "org.gnome.desktop.interface", key: "gtk-theme",            value: "'catppuccin-mocha-lavender-standard+default'" }
  - { schema: "org.gnome.desktop.interface", key: "icon-theme",           value: "'Papirus-Dark'" }
  - { schema: "org.gnome.desktop.interface", key: "cursor-theme",         value: "'Bibata-Modern-Classic'" }
  - { schema: "org.gnome.desktop.interface", key: "cursor-size",          value: "24" }
  - { schema: "org.gnome.desktop.interface", key: "color-scheme",         value: "'prefer-dark'" }
  - { schema: "org.gnome.desktop.interface", key: "accent-color",         value: "'yellow'" }
  - { schema: "org.gnome.desktop.interface", key: "font-name",            value: "'Inter 11'" }
  - { schema: "org.gnome.desktop.interface", key: "document-font-name",   value: "'Inter 11'" }
  - { schema: "org.gnome.desktop.interface", key: "monospace-font-name",  value: "'JetBrainsMono Nerd Font 10'" }
  - { schema: "org.gnome.desktop.interface", key: "font-hinting",         value: "'slight'" }
  - { schema: "org.gnome.desktop.interface", key: "font-antialiasing",    value: "'rgba'" }
  - { schema: "org.gnome.desktop.interface", key: "font-rgba-order",      value: "'rgb'" }
