---
- name: Normalize dotfile paths
  ansible.builtin.set_fact:
    dotfile_repo_path: "{{ configs.dotfile_repo_path | expanduser }}"
    dotfile_backup_root: "{{ configs.dotfile_backup_path | expanduser }}"
    dotfile_home: "{{ ansible_facts['user_dir'] }}"

- name: Define backup directory
  ansible.builtin.set_fact:
    dotfile_backup_dir: "{{ dotfile_backup_root }}/{{ backup_timestamp }}"
  vars:
    backup_timestamp: "{{ (ansible_facts['date_time']['iso8601_basic'] if ansible_facts['date_time'] is defined else lookup('pipe', 'date +%Y%m%d%H%M%SZ')) | regex_replace('T', '') }}"

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ dotfile_backup_dir }}"
    state: directory
    mode: "0755"
  check_mode: false

- name: Gather existing direct dotfiles
  ansible.builtin.stat:
    path: "{{ dotfile_home }}/.{{ item }}"
    follow: true
  loop: "{{ dotfile_directly | default([]) }}"
  loop_control:
    label: ".{{ item }}"
  register: dotfile_direct_stats

- name: Ensure subdirectories exist for direct dotfiles
  ansible.builtin.file:
    path: "{{ dotfile_backup_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: >-
    {{ dotfile_direct_stats.results
       | selectattr('stat.exists')
       | map(attribute='item')
       | map('dirname')
       | reject('equalto','.')
       | unique
       | list }}
  loop_control:
    label: "{{ item }}"
  check_mode: false

- name: Backup existing direct dotfiles
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ dotfile_backup_dir }}/{{ item.item }}"
    remote_src: true
    follow: true
    mode: preserve
  loop: "{{ dotfile_direct_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Symlink direct dotfiles into place
  ansible.builtin.file:
    src: "{{ dotfile_repo_path }}/data/{{ item }}"
    dest: "{{ dotfile_home }}/.{{ item }}"
    state: link
    force: true
  loop: "{{ dotfile_directly | default([]) }}"
  loop_control:
    label: ".{{ item }}"

- name: Inspect repository directories for partial dotfiles
  ansible.builtin.stat:
    path: "{{ dotfile_repo_path }}/data/{{ item }}"
  loop: "{{ dotfile_partially | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: dotfile_partial_repo_stats

- name: Collect existing partial dotfile repositories
  ansible.builtin.set_fact:
    dotfile_partial_repos: "{{ dotfile_partial_repo_stats.results | selectattr('stat.exists') | list }}"

- name: Reset partial dotfile entry list
  ansible.builtin.set_fact:
    dotfile_partial_entries: []

- name: Initialize partial repository discovery results
  ansible.builtin.set_fact:
    dotfile_partial_repo_results: []

- name: Discover repository entries for partial dotfiles
  ansible.builtin.find:
    paths: "{{ item.stat.path }}"
    file_type: any
    recurse: false
  loop: "{{ dotfile_partial_repos | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  register: dotfile_partial_repo
  when: (dotfile_partial_repos | default([])) | length > 0

- name: Store partial repository discovery results
  ansible.builtin.set_fact:
    dotfile_partial_repo_results: "{{ dotfile_partial_repo.results | default([]) }}"
  when: dotfile_partial_repo is defined

- name: Ensure backup directories exist for partial dotfiles
  ansible.builtin.file:
    path: "{{ dotfile_backup_dir }}/{{ item.item.item }}"
    state: directory
    mode: "0700"
  loop: "{{ dotfile_partial_repo_results }}"
  loop_control:
    label: "{{ item.item.item }}"
  check_mode: false

- name: Ensure partial dotfile directories exist
  ansible.builtin.file:
    path: "{{ dotfile_home }}/.{{ item.item.item }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfile_partial_repo_results }}"
  loop_control:
    label: ".{{ item.item.item }}"

- name: Build list of partial dotfile entries
  ansible.builtin.set_fact:
    dotfile_partial_entries: "{{ (dotfile_partial_entries | default([])) + [entry] }}"
  vars:
    entry:
      dir: "{{ item.0.item.item }}"
      name: "{{ item.1.path | basename }}"
      source: "{{ item.1.path }}"
  loop: "{{ dotfile_partial_repo_results | subelements('files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.item }}/{{ item.1.path | basename }}"

- name: Gather existing partial dotfiles
  ansible.builtin.stat:
    path: "{{ dotfile_home }}/.{{ item.dir }}/{{ item.name }}"
    follow: false
  loop: "{{ dotfile_partial_entries | default([]) }}"
  loop_control:
    label: ".{{ item.dir }}/{{ item.name }}"
  register: dotfile_partial_stats

- name: Backup existing partial dotfiles
  ansible.builtin.copy:
    src: "{{ dotfile_home }}/.{{ item.item.dir }}/{{ item.item.name }}{{ '/' if item.stat.isdir | default(false) else '' }}"
    dest: "{{ dotfile_backup_dir }}/{{ item.item.dir }}/{{ item.item.name }}"
    remote_src: true
    follow: true
    mode: preserve
  loop: "{{ dotfile_partial_stats.results }}"
  loop_control:
    label: "{{ item.item.dir }}/{{ item.item.name }}"
  when:
    - item.stat.exists
    - not (
        item.stat.islnk | default(false) and
        (item.stat.lnk_source | default(item.stat.lnk_target | default(''))) == item.item.source
      )

- name: Remove existing partial dotfiles after backup
  ansible.builtin.file:
    path: "{{ dotfile_home }}/.{{ item.item.dir }}/{{ item.item.name }}"
    state: absent
  loop: "{{ dotfile_partial_stats.results }}"
  loop_control:
    label: "{{ item.item.dir }}/{{ item.item.name }}"
  when:
    - item.stat.exists
    - not (
        item.stat.islnk | default(false) and
        (item.stat.lnk_source | default(item.stat.lnk_target | default(''))) == item.item.source
      )

- name: Symlink partial dotfiles into place
  ansible.builtin.file:
    src: "{{ item.source }}"
    dest: "{{ dotfile_home }}/.{{ item.dir }}/{{ item.name }}"
    state: link
    force: true
  loop: "{{ dotfile_partial_entries | default([]) }}"
  loop_control:
    label: ".{{ item.dir }}/{{ item.name }}"

# Handle custom path dotfiles
- name: Gather existing custom dotfiles
  ansible.builtin.stat:
    path: "{{ dotfile_home }}/{{ item.dest }}"
    follow: true
  loop: "{{ dotfile_custom | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfile_custom_stats

- name: Ensure subdirectories exist for custom dotfiles (backup)
  ansible.builtin.file:
    path: "{{ dotfile_backup_dir }}/{{ item.dest | dirname }}"
    state: directory
    mode: "0700"
  loop: "{{ dotfile_custom | default([]) }}"
  loop_control:
    label: "{{ item.dest | dirname }}"
  when:
    - dotfile_custom is defined
    - item.dest | dirname != '.'
  check_mode: false

- name: Ensure subdirectories exist for custom dotfiles (destination)
  ansible.builtin.file:
    path: "{{ dotfile_home }}/{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfile_custom | default([]) }}"
  loop_control:
    label: "{{ item.dest | dirname }}"
  when:
    - dotfile_custom is defined
    - item.dest | dirname != '.'

- name: Backup existing custom dotfiles
  ansible.builtin.copy:
    src: "{{ dotfile_home }}/{{ item.item.dest }}"  # <-- Add dotfile_home here
    dest: "{{ dotfile_backup_dir }}/{{ item.item.dest }}"
    remote_src: true
    follow: true
    mode: preserve
  loop: "{{ dotfile_custom_stats.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.stat.exists

- name: Symlink custom dotfiles into place
  ansible.builtin.file:
    src: "{{ dotfile_repo_path }}/data/{{ item.src }}"
    dest: "{{ dotfile_home }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfile_custom | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Clone tmux plugin manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm.git
    dest: "{{ dotfile_home }}/.tmux/plugins/tpm"
    version: v3.1.0
    update: true

# ============================================================================
# libadwaita theme passthrough
# Symlink the active system theme's gtk-4.0 directory into the user config
# so libadwaita (GTK4 GNOME apps) honors the same theme as GTK3.
# ============================================================================
- name: Ensure ~/.config/gtk-4.0 exists for libadwaita symlinks
  ansible.builtin.file:
    path: "{{ dotfile_home }}/.config/gtk-4.0"
    state: directory
    mode: "0755"
  when: dotfile_libadwaita_theme | default('') | length > 0

- name: Symlink libadwaita theme assets from the active system theme
  ansible.builtin.file:
    src: "/usr/share/themes/{{ dotfile_libadwaita_theme }}/gtk-4.0/{{ item }}"
    dest: "{{ dotfile_home }}/.config/gtk-4.0/{{ item }}"
    state: link
    force: true
  loop:
    - gtk.css
    - gtk-dark.css
    - assets
  when: dotfile_libadwaita_theme | default('') | length > 0

# ============================================================================
# Per-mode palette active symlinks (managed at runtime by ~/.bin/sunset).
# Bootstrap them to the cool variant so a fresh install has working
# styles before the user ever toggles. The sunset script retargets them
# on each on/off. Symlinks are relative (target lives in the same dir).
# ============================================================================
- name: Bootstrap palette-active symlinks (cool defaults)
  ansible.builtin.file:
    src: "{{ item.target }}"
    dest: "{{ dotfile_home }}/.config/{{ item.path }}"
    state: link
    force: false
  loop:
    - { path: "foot/colors-active.ini",       target: "colors-cool.ini" }
    - { path: "waybar/palette-active.css",    target: "palette-cool.css" }
    - { path: "swaync/style-active.css",      target: "style-cool.css" }
  loop_control:
    label: "{{ item.path }} -> {{ item.target }}"

# ============================================================================
# GSETTINGS / dconf — make sure libadwaita apps, xdg-desktop-portal and
# any GNOME setting consumer agree with the *.ini files we ship in
# data/config/gtk-*/. Without this, dconf defaults silently override our
# theme / cursor / dark-mode / font choices in modern apps.
#
# Idempotent: gsettings only writes when the desired value differs from
# the live one, so re-running the playbook is cheap and reports
# 'changed' only on the keys that actually moved.
# ============================================================================
- name: Apply GSettings desktop preferences
  ansible.builtin.command:
    cmd: "gsettings set {{ item.schema }} {{ item.key }} {{ item.value }}"
  register: dotfile_gsettings_apply
  changed_when: false
  failed_when:
    - dotfile_gsettings_apply.rc != 0
    - "'No such schema' not in (dotfile_gsettings_apply.stderr | default(''))"
  loop: "{{ dotfile_gsettings | default([]) }}"
  loop_control:
    label: "{{ item.schema }}/{{ item.key }}"

# ============================================================================
# Per-machine sway output configuration.
#
# Replaces kanshi: on first provisioning we run ~/.bin/sway-detect-outputs
# once, which writes ~/.config/sway/outputs.local based on the currently
# connected monitors (matched by EDID make/model/serial). Subsequent
# `make dotfiles` runs are skipped via `creates:` so any hand-edits the
# user makes to that file (scale, position, disabling an output) are
# preserved. To regenerate after a hardware change, run the script
# directly with `~/.bin/sway-detect-outputs --force`.
#
# The script itself bails out cleanly if sway is not yet running (fresh
# install), so this task is safe to run from a TTY before sway has been
# started — it just won't produce a file yet. In that case the user runs
# the script after their first sway session.
# ============================================================================
- name: Detect sway outputs and write per-machine config (first provisioning)
  ansible.builtin.command:
    cmd: "{{ dotfile_home }}/.bin/sway-detect-outputs"
    creates: "{{ dotfile_home }}/.config/sway/outputs.local"
  register: dotfile_sway_outputs_detect
  changed_when: "'Wrote ' in (dotfile_sway_outputs_detect.stdout | default(''))"
  failed_when: false
  when:
    - configs.vm | default('') == 'sway'
# ============================================================================
# VS Code extension provisioning.
#
# Runs the dotfiles' install-vscode-extensions.sh on every dotfile
# provisioning. The script is idempotent: it queries
# `code --list-extensions` first and only installs the ones that are
# missing, so repeated runs are cheap. It also bails out cleanly when
# `code` is not installed (e.g. on the server profile), so this task
# can run unconditionally without a profile gate.
# ============================================================================
- name: Install or update VS Code extensions
  ansible.builtin.command:
    cmd: "{{ dotfile_repo_path }}/data/Code/install-vscode-extensions.sh"
  register: dotfile_vscode_extensions
  changed_when: "'Installed ' in (dotfile_vscode_extensions.stdout | default(''))"
  failed_when: false
