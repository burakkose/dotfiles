---
- name: Resolve system profile
  ansible.builtin.set_fact:
    system_ubuntu_profile: "{{ system_profile | default(configs.vm | default('sway')) }}"

- name: Validate system profile
  ansible.builtin.assert:
    that:
      - system_ubuntu_profile in ['server', 'i3', 'sway']
    fail_msg: "system_profile or configs.vm must be one of: server, i3, sway"

- name: Resolve active APT repositories
  ansible.builtin.set_fact:
    system_ubuntu_active_repos: "{{ system_ubuntu_repos + (system_ubuntu_repos_desktop if system_ubuntu_profile != 'server' else []) }}"

- name: Resolve active APT preferences
  ansible.builtin.set_fact:
    system_ubuntu_active_apt_preferences: "{{ system_ubuntu_apt_preferences + (system_ubuntu_apt_preferences_desktop if system_ubuntu_profile != 'server' else []) }}"

# =============================================================================
# Repository Setup
# =============================================================================
- name: Install APT repository prerequisites
  ansible.builtin.apt:
    name: "{{ system_ubuntu_repository_prerequisites }}"
    state: present
    update_cache: true

- name: Add PPAs
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
  loop: "{{ system_ubuntu_ppa }}"

- name: Add desktop PPAs
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
  loop: "{{ system_ubuntu_ppa_desktop }}"
  when: system_ubuntu_profile != 'server'

- name: Add i3 PPAs
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
  loop: "{{ system_ubuntu_ppa_i3 }}"
  when: system_ubuntu_profile == 'i3'

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GPG keys
  ansible.builtin.get_url:
    url: "{{ item.key_url }}"
    dest: "/etc/apt/keyrings/{{ item.key_file }}"
    mode: "0644"
  loop: "{{ system_ubuntu_active_repos }}"

- name: Verify APT repository GPG key fingerprints
  ansible.builtin.command:
    cmd: "gpg --show-keys --with-colons /etc/apt/keyrings/{{ item.key_file }}"
  register: system_ubuntu_repo_key
  changed_when: false
  failed_when: >-
    system_ubuntu_repo_key.rc != 0 or
    (item.fingerprint is defined and item.fingerprint not in system_ubuntu_repo_key.stdout)
  loop: "{{ system_ubuntu_active_repos }}"

- name: Add APT repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
  loop: "{{ system_ubuntu_active_repos }}"

- name: Configure APT preferences
  ansible.builtin.copy:
    dest: "/etc/apt/preferences.d/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop: "{{ system_ubuntu_active_apt_preferences }}"

# =============================================================================
# System Update
# =============================================================================
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

# =============================================================================
# APT Package Installation
# =============================================================================
- name: Accept Microsoft fonts EULA
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: select
  when: system_ubuntu_profile != 'server'

- name: Check for Firefox snap
  ansible.builtin.command:
    cmd: snap list firefox
  register: system_ubuntu_firefox_snap
  changed_when: false
  failed_when: false
  when: system_ubuntu_profile != 'server'

- name: Remove Firefox snap
  ansible.builtin.command:
    cmd: snap remove firefox
  when:
    - system_ubuntu_profile != 'server'
    - system_ubuntu_firefox_snap.rc | default(1) == 0

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_ubuntu_packages }}"

- name: Install server packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_ubuntu_packages_server }}"
  when: system_ubuntu_profile == 'server'

- name: Install desktop packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_ubuntu_packages_desktop }}"
  when: system_ubuntu_profile != 'server'

- name: Install i3 packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_ubuntu_packages_i3 }}"
  when: system_ubuntu_profile == 'i3'

- name: Install sway packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ system_ubuntu_packages_sway }}"
  when: system_ubuntu_profile == 'sway'

# =============================================================================
# Pip Package Installation
# =============================================================================
- name: Install pip packages
  ansible.builtin.pip:
    name: "{{ system_ubuntu_packages_pip }}"
    executable: pip3
    state: present
  when: system_ubuntu_packages_pip | length > 0

- name: Install cargo packages
  become: false
  ansible.builtin.command:
    cmd: >-
      cargo install {{ item.name }}
      {% if item.version is defined %}--version {{ item.version }} --locked{% endif %}
    creates: "~/.cargo/bin/{{ item.binary }}"
  loop: "{{ system_ubuntu_packages_cargo }}"

# =============================================================================
# Git Repository Clones
# =============================================================================
- name: Clone git repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('master') }}"
    depth: 1
    update: true
  become: "{{ item.become | default(true) }}"
  when: item.when is not defined or item.when == system_ubuntu_profile or (item.when == 'desktop' and system_ubuntu_profile != 'server')
  loop: "{{ system_ubuntu_git_installs }}"

# =============================================================================
# Gruvbox GTK Theme
# =============================================================================
- name: Install Gruvbox GTK theme
  ansible.builtin.command:
    cmd: ./install.sh -t all -d /usr/share/themes
    chdir: /tmp/gruvbox-gtk-theme/themes
    creates: /usr/share/themes/Gruvbox-Dark
  when: system_ubuntu_profile != 'server'

# =============================================================================
# nwg-displays (Sway)
# =============================================================================
- name: Install nwg-displays from source
  ansible.builtin.pip:
    name: /tmp/nwg-displays
    executable: pip3
    state: present
  when: system_ubuntu_profile == 'sway'

# =============================================================================
# swaylock-effects (Sway)
# =============================================================================
- name: Build and install swaylock-effects
  when: system_ubuntu_profile == 'sway'
  block:
    - name: Setup swaylock-effects build
      ansible.builtin.command:
        cmd: meson setup build
        chdir: /tmp/swaylock-effects
        creates: /tmp/swaylock-effects/build

    - name: Build swaylock-effects
      ansible.builtin.command:
        cmd: ninja -C build
        chdir: /tmp/swaylock-effects
        creates: /tmp/swaylock-effects/build/swaylock

    - name: Install swaylock-effects
      ansible.builtin.command:
        cmd: ninja -C build install
        chdir: /tmp/swaylock-effects
        creates: /usr/local/bin/swaylock

# =============================================================================
# PathPicker
# =============================================================================
- name: Build PathPicker deb package
  ansible.builtin.command:
    cmd: ./package.sh
    chdir: /tmp/PathPicker/debian
    creates: /tmp/PathPicker/pathpicker_0.9.5_all.deb

- name: Find PathPicker deb package
  ansible.builtin.find:
    paths: /tmp/PathPicker
    patterns: "pathpicker_*_all.deb"
  register: system_ubuntu_pathpicker_deb

- name: Validate PathPicker deb package exists
  ansible.builtin.assert:
    that:
      - system_ubuntu_pathpicker_deb.files | length > 0
    fail_msg: "PathPicker package.sh did not create a pathpicker deb package in /tmp/PathPicker"

- name: Install PathPicker deb package
  ansible.builtin.apt:
    deb: "{{ system_ubuntu_pathpicker_deb.files[0].path }}"

# =============================================================================
# Fonts
# =============================================================================
- name: Create fonts directory
  become: false
  ansible.builtin.file:
    path: ~/.local/share/fonts
    state: directory
    mode: "0755"
  when: system_ubuntu_profile != 'server'

- name: Download and install fonts
  become: false
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: ~/.local/share/fonts
    remote_src: true
  loop: "{{ system_ubuntu_fonts }}"
  when: system_ubuntu_profile != 'server'

- name: Install Powerline fonts from source
  become: false
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: ~/.local/src/powerline-fonts
    creates: ~/.local/share/fonts/Inconsolata for Powerline.otf
  when: system_ubuntu_profile != 'server'

- name: Install Siji font
  become: false
  ansible.builtin.copy:
    src: ~/.local/src/siji/pcf/siji.pcf
    dest: ~/.local/share/fonts/siji.pcf
    remote_src: true
    mode: "0644"
  when: system_ubuntu_profile != 'server'

- name: Generate bitmap font index
  become: false
  ansible.builtin.command:
    cmd: mkfontdir ~/.local/share/fonts
  changed_when: false
  when: system_ubuntu_profile != 'server'

- name: Refresh font cache
  become: false
  ansible.builtin.command:
    cmd: fc-cache -fv
  changed_when: false
  when: system_ubuntu_profile != 'server'

# =============================================================================
# Symlinks
# =============================================================================
- name: Create common symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ system_ubuntu_symlinks }}"

- name: Create desktop symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ system_ubuntu_symlinks_desktop }}"
  when: system_ubuntu_profile != 'server'

- name: Link copy command
  ansible.builtin.file:
    src: "{{ (system_ubuntu_profile == 'sway') | ternary('/usr/bin/wl-copy', '/usr/bin/xclip') }}"
    dest: /usr/bin/copy
    state: link
    force: true
  when: system_ubuntu_profile != 'server'

# =============================================================================
# i3-specific: urxvt-perls
# =============================================================================
- name: Install urxvt-perls for i3
  when: system_ubuntu_profile == 'i3'
  block:
    - name: Download urxvt-perls
      become: false
      ansible.builtin.unarchive:
        src: https://github.com/muennich/urxvt-perls/archive/2.2.tar.gz
        dest: /tmp
        remote_src: true

    - name: Create urxvt perl directory
      ansible.builtin.file:
        path: /usr/lib/urxvt/perl/
        state: directory
        mode: "0755"

    - name: Install urxvt-perls
      ansible.builtin.shell:
        cmd: cp /tmp/urxvt-perls-2.2/* /usr/lib/urxvt/perl/
        creates: /usr/lib/urxvt/perl/keyboard-select
