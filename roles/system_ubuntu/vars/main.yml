---
# =============================================================================
# APT Repositories with GPG keys
# =============================================================================
system_ubuntu_repository_prerequisites:
  - ca-certificates
  - gpg
  - software-properties-common

system_ubuntu_repos:
  - name: eza
    key_url: https://raw.githubusercontent.com/eza-community/eza/main/deb.asc
    key_file: gierens.asc
    fingerprint: 1548BC8A4B4D2688F9B0DAF7EC29E2090CE3FD43
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.asc] https://deb.gierens.de stable main"

system_ubuntu_repos_desktop:
  - name: mozilla
    key_url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    key_file: packages.mozilla.org.asc
    fingerprint: 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3
    repo: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main"

  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    key_file: microsoft.asc
    fingerprint: BC528686B50D79E339D3721CEB3E94ADBE1229CF
    repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"

# =============================================================================
# APT Preferences
# =============================================================================
system_ubuntu_apt_preferences: []

system_ubuntu_apt_preferences_desktop:
  - name: mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

      Package: firefox*
      Pin: release o=Ubuntu
      Pin-Priority: -1

# =============================================================================
# PPAs
# =============================================================================
system_ubuntu_ppa:
  - ppa:zhangsongcui3371/fastfetch

system_ubuntu_ppa_desktop:
  - ppa:papirus/papirus

system_ubuntu_ppa_i3:
  - ppa:apandada1/brightness-controller

# =============================================================================
# APT Packages
# =============================================================================
system_ubuntu_packages:
  # Core
  - apt-transport-https
  - build-essential
  - ca-certificates
  - cargo
  - curl
  - git
  - git-core
  - gpg
  - openssh-client
  - software-properties-common
  - thefuck
  - wget

  # Modern CLI tools
  - bat
  - btop
  - duf
  - eza
  - fastfetch
  - fd-find
  - fzf
  - htop
  - httpie
  - jq
  - powerline
  - ranger
  - ripgrep
  - silversearcher-ag
  - tig
  - tmux
  - unrar

  # Shell
  - zsh

  # Container
  - podman

  # Shell history / productivity
  - atuin

  # Git tooling
  - git-delta
  - lazygit

  # Docs / reading
  - glow

  # Python
  - python3-dev
  - python3-pip

system_ubuntu_packages_server:
  - openssh-server

system_ubuntu_packages_desktop:
  # GUI applications
  - code
  - featherpad
  - firefox
  - galculator
  - gsimplecal
  - imagemagick
  - libreoffice
  - loupe
  - nautilus
  - papers
  - transmission-gtk
  - xarchiver

  # Appearance
  - bibata-cursor-theme
  - fonts-font-awesome
  - fonts-inconsolata
  - fonts-inter
  - fonts-jetbrains-mono
  - fonts-noto
  - fonts-noto-cjk
  - fonts-noto-color-emoji
  - fonts-powerline
  - fonts-symbola
  - papirus-icon-theme
  - sassc
  - ttf-mscorefonts-installer
  - xfonts-utils

  # Audio
  - pavucontrol

  # Network
  - bluez
  - network-manager-gnome
  - network-manager-openvpn-gnome
  - openvpn
  - wireguard-tools

# =============================================================================
# WM-specific APT Packages
# =============================================================================
system_ubuntu_packages_i3:
  - arandr
  - brightness-controller
  - brightnessctl
  - cbatticon
  - feh
  - i3
  - lxappearance
  - lxinput
  - polybar
  - pulseaudio
  - redshift
  - rofi
  - rxvt-unicode-256color
  - scrot
  - vlc
  - volumeicon-alsa
  - wmctrl
  - xclip
  - xinit
  - xorg

system_ubuntu_packages_sway:
  - brightnessctl
  - cliphist
  - foot
  - gammastep
  - grim
  - kanshi
  - libspa-0.2-bluetooth
  - mpv
  - pipewire
  - pipewire-audio-client-libraries
  - pipewire-pulse
  - playerctl
  - satty
  - slurp
  - sway
  - sway-notification-center
  - swaybg
  - udiskie
  - waybar
  - wireplumber
  - wl-clipboard
  - wofi
  - xdg-desktop-portal-wlr
  # nwg-displays dependencies
  - libgtk-layer-shell0
  - python3-gi
  - python3-i3ipc
  # swaylock-effects build dependencies
  - libcairo2-dev
  - libgdk-pixbuf-2.0-dev
  - libpam0g-dev
  - libpango1.0-dev
  - libwayland-dev
  - libxkbcommon-dev
  - meson
  - scdoc
  - wayland-protocols

# =============================================================================
# Pip Packages
# =============================================================================
system_ubuntu_packages_pip: []

# =============================================================================
# Cargo Packages
# =============================================================================
system_ubuntu_packages_cargo:
  - name: du-dust
    binary: dust
    version: 1.1.1

# =============================================================================
# Git-based Installs
# =============================================================================
system_ubuntu_git_installs:
  - name: zinit
    repo: https://github.com/zdharma-continuum/zinit.git
    dest: /usr/share/zinit
    version: v3.9.0

  - name: tpm
    repo: https://github.com/tmux-plugins/tpm
    dest: ~/.tmux/plugins/tpm
    version: v3.1.0
    become: false

  - name: powerline-fonts
    repo: https://github.com/powerline/fonts.git
    dest: ~/.local/src/powerline-fonts
    version: a029626780dd4af32f15a3e708a5b00528c22f1d
    become: false
    when: desktop

  - name: siji
    repo: https://github.com/stark/siji.git
    dest: ~/.local/src/siji
    version: c691f200c1c66e76daa2afc9cbbd1aa39045c906
    become: false
    when: desktop

  - name: catppuccin-gtk-theme
    repo: https://github.com/catppuccin/gtk.git
    dest: /tmp/catppuccin-gtk
    version: v1.0.3
    when: desktop

  - name: nwg-displays
    repo: https://github.com/nwg-piotr/nwg-displays.git
    dest: /tmp/nwg-displays
    version: v0.4.2
    when: sway

  - name: swaylock-effects
    repo: https://github.com/mortie/swaylock-effects.git
    dest: /tmp/swaylock-effects
    version: v1.6-4
    when: sway

  - name: PathPicker
    repo: https://github.com/facebook/PathPicker.git
    dest: /tmp/PathPicker
    version: 0.9.5

# =============================================================================
# Fonts
# =============================================================================
system_ubuntu_fonts:
  - name: JetBrainsMono
    url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz

# =============================================================================
# Symlinks
# =============================================================================
system_ubuntu_symlinks:
  - src: /usr/bin/fdfind
    dest: /usr/local/bin/fd

system_ubuntu_symlinks_desktop:
  - src: /usr/bin/firefox
    dest: /usr/bin/browser
  - src: /usr/bin/featherpad
    dest: /usr/bin/editor
